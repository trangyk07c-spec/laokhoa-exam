<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Mặt bệnh bổ sung — Lão khoa</title><link rel="stylesheet" href="app.css"></head><body><main class="main" style="max-width:1050px;margin:auto"><div class="top"><a href="index.html" class="toolbtn">← Bài học</a><a href="quiz.html" class="toolbtn">MCQ</a><strong>V8 · Mặt bệnh dữ liệu động</strong></div><div class="content"><div class="update-banner"></div><div id="lessonRoot"><div class="card">Đang tải bài…</div></div></div></main><script src="update.js"></script><script>
(async()=>{const slug=new URLSearchParams(location.search).get('topic');const root=document.getElementById('lessonRoot');try{const d=await (await fetch('data/extra-lessons.json?t='+Date.now(),{cache:'no-store'})).json();const x=(d.lessons||[]).find(v=>v.slug===slug);if(!x){root.innerHTML='<div class="card"><h2>Chưa có bài này</h2><p>Quay lại trang chủ và chọn mặt bệnh trong danh sách.</p></div>';return;}document.title=x.title+' — Lão khoa';root.innerHTML=`<article class="lesson-page"><div class="hero"><div class="kicker">MẶT BỆNH BỔ SUNG</div><h2>${x.title}</h2><p class="lead">${x.summary||''}</p></div>${x.html||''}</article>`;}catch(e){root.innerHTML='<div class="card">Không tải được bài khi offline lần đầu. Hãy mở một lần khi có mạng.</div>';}})();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script></body></html>
