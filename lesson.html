<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Mặt bệnh bổ sung — Lão khoa</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="ui-v83.css?v=83"><link rel="stylesheet" href="ui-v84.css?v=84"><link rel="stylesheet" href="standards-v85.css?v=85"><link rel="stylesheet" href="hotfix-v851.css?v=851"></head>
<body data-page="lesson.html"><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="top"><div class="mobile-nav"></div><strong>V8.5.1 · Bài bổ sung dữ liệu động</strong></div><div class="content"><div class="update-banner"></div><div id="lessonRoot"><div class="card">Đang tải bài…</div></div></div></main></div>
<script src="content-v82.js"></script><script src="shell-fix-v851.js?v=851"></script><script src="nav-v82.js?v=84"></script><script src="extra-nav-v851.js?v=851"></script><script src="update.js"></script>
<script>
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const path=a=>!Array.isArray(a)?'':'<div class="v84-path">'+a.map((x,i)=>'<div class="v84-step"><div class="v84-step-no">'+(i+1)+'</div><div class="v84-step-body"><span class="v84-step-title">'+E(x.title||('Bước '+(i+1)))+'</span><p>'+E(x.body||'')+'</p></div></div>').join('')+'</div>';
const tbl=t=>!t||!t.headers||!t.rows?'':'<table class="v85-table"><tr>'+t.headers.map(h=>'<th>'+E(h)+'</th>').join('')+'</tr>'+t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+E(c)+'</td>').join('')+'</tr>').join('')+'</table>';
function body(x){let s='';if(x.mechanism)s+='<section class="v84-section"><h2>1. Cơ chế bệnh sinh</h2>'+x.mechanism+'</section>';if(x.diagnostic_html||x.diagnostic)s+='<section class="v84-section"><h2>2. Tiêu chuẩn chẩn đoán</h2>'+(x.diagnostic_html||'<p>'+E(x.diagnostic)+'</p>')+'</section>';if(Array.isArray(x.classifications))s+='<section class="v84-section"><h2>3. Phân loại / phân độ / phân tầng đầy đủ</h2>'+x.classifications.map(c=>'<h3>'+E(c.title||'')+'</h3>'+tbl(c)).join('')+'</section>';if(x.approach)s+='<section class="v84-section"><h2>4. Tiếp cận người bệnh</h2>'+path(x.approach)+'</section>';if(x.treatment_html||x.treatment)s+='<section class="v84-section"><h2>5. Điều trị / xử trí</h2>'+(x.treatment_html||'<p>'+E(x.treatment)+'</p>')+'</section>';if(x.geriatric_html||x.geriatric)s+='<section class="v84-section"><h2>6. Điểm riêng ở người ≥60 tuổi</h2>'+(x.geriatric_html||'<p>'+E(x.geriatric)+'</p>')+'</section>';if(x.drug_html)s+='<section class="v84-section"><h2>7. Thuốc cần biết</h2>'+x.drug_html+'</section>';if(x.exam_html)s+='<section class="v84-section"><h2>8. Bẫy thi & điểm chốt</h2>'+x.exam_html+'</section>';if(x.sources_html)s+='<section class="v84-section"><h2>Nguồn</h2>'+x.sources_html+'</section>';return s||x.html||''}
(async()=>{const slug=new URLSearchParams(location.search).get('topic'),root=document.getElementById('lessonRoot');try{let d;try{d=window.LK?await LK.load('extra-lessons'):null}catch(e){}if(!d){const r=await fetch('extra-lessons.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();d=await r.json()}const x=(d.lessons||[]).find(v=>v.slug===slug);if(!x){root.innerHTML='<div class="card"><h2>Chưa có bài này</h2></div>';return}document.title=x.title+' — Lão khoa';root.innerHTML='<article class="lesson-page"><section class="v84-page-hero"><div class="eyebrow">'+E(x.system||'MẶT BỆNH BỔ SUNG')+'</div><h1>'+E(x.title)+'</h1><p>'+E(x.summary||'')+'</p><div class="v84-pill-row"><span class="v84-pill">Lão khoa Việt Nam: ≥60 tuổi</span></div></section>'+body(x)+'</article>'}catch(e){root.innerHTML='<div class="card"><h2>Không tải được bài</h2><p>Kiểm tra extra-lessons.json.</p></div>'}})();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
